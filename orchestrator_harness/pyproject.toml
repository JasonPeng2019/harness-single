[project]
name = "portable-orchestrator-harness"
version = "0.1.0"
description = "Durable event observation and lane control for parallel coding work"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
orchestrator_harness = ["assets/codex/*.json", "assets/codex/*.py"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [".."]
reportImplicitRelativeImport = "none"
